name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build runtime
        run: npm run build:runtime

      - name: Run tests
        run: npm test --workspace=@bettertext/babylon-tmp-text --if-present

      - name: Package dist
        run: tar -czvf bettertext-babylon-tmp-text-${{ github.ref_name }}.tar.gz -C packages/runtime/dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: bettertext-babylon-tmp-text-${{ github.ref_name }}.tar.gz
