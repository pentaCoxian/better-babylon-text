name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test --workspace=@bettertext/babylon-tmp-text --if-present

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/runtime/dist/**/*

      - name: Publish to npm
        run: npm publish --workspace=@bettertext/babylon-tmp-text --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
