name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build runtime
        run: npm run build:runtime

      - name: Run tests
        run: npm test --workspace=@bettertext/babylon-tmp-text --if-present

      - name: Type check
        run: npm run typecheck --workspace=@bettertext/babylon-tmp-text --if-present

      - name: Build demo
        run: npm run build:demo
